# Apache Virtual Host Configuration for eradashboard.com.et / www.eradashboard.com.et
# Save this file on your server (e.g., in /etc/apache2/sites-available/eradashboard.com.et.conf)

<VirtualHost *:80>
    ServerName eradashboard.com.et
    ServerAlias www.eradashboard.com.et
    
    # Redirect all HTTP requests to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName eradashboard.com.et
    ServerAlias www.eradashboard.com.et

    # SSL Configuration (Requires mod_ssl)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/eradashboard.com.et/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/eradashboard.com.et/privkey.pem

    # Security Headers (Requires mod_headers)
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer-when-downgrade"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

    # Proxy Configuration (Requires mod_proxy and mod_proxy_http)
    ProxyPreserveHost On
    
    # WebSocket support (Requires mod_proxy_wstunnel)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*)           ws://127.0.0.1:3000/$1 [P,L]

    # Proxy standard HTTP/HTTPS traffic to port 3000
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # Compression Configuration (Requires mod_deflate)
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/eradashboard.com.et_error.log
    CustomLog ${APACHE_LOG_DIR}/eradashboard.com.et_access.log combined
</VirtualHost>
